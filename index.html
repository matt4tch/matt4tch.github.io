<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Matthew Tchouikine — CS & Pure Math student at the University of Waterloo. Interactive terminal portfolio showcasing projects, skills, and experience.">
  <title>Matthew Tchouikine | Terminal Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link id="theme" rel="stylesheet" href="css/themes/dark.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="terminal">
    <div id="title-bar">
      <div class="title-bar-dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="title-bar-text">visitor@matt4tch.dev:~</div>
    </div>
    <div id="terminal-body">
      <div id="output"></div>
      <div id="input-line">
        <span class="prompt"><span class="prompt-user">visitor</span>@<span class="prompt-host">matt4tch.dev</span>:~$</span>
        <span id="input-wrapper">
          <input type="text" id="command-input" autocomplete="off" autofocus spellcheck="false" aria-label="Terminal command input">
          <span id="cursor-block"></span>
        </span>
        <span id="vim-mode"></span>
      </div>
    </div>
  </div>
  <script type="module" src="js/terminal.js"></script>
</body>
</html>
